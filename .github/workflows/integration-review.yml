name: RYOKO integration review
on:
  push:
    branches: [integration/ryoko-2026-10-21]
    paths:
      - 'index.html'
      - 'assets/review-features.js'
      - 'tests/review-flow.cjs'
      - '.github/workflows/integration-review.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax checks
        run: |
          node --check assets/review-features.js
          node --check tests/review-flow.cjs
      - name: Install Chromium and test runner
        run: |
          npm install --prefix /tmp/ryoko-tests playwright@1.64.1
          /tmp/ryoko-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser integration test
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/ryoko-http.log 2>&1 &
          sleep 2
          export NODE_PATH=/tmp/ryoko-tests/node_modules
          export CHROMIUM_PATH="$(node -p 'require("/tmp/ryoko-tests/node_modules/playwright").chromium.executablePath()')"
          node tests/review-flow.cjs
      - name: Save failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ryoko-review-failure
          path: |
            /tmp/oracle-review-error.png
            /tmp/ryoko-http.log
          retention-days: 3
          if-no-files-found: ignore
