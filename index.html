<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14101f">
<title>月の案内人 りょうこ｜今夜、あなたに必要なメッセージ</title>
<style>
.guide-switch{display:flex;justify-content:center;gap:8px;margin:20px auto 0;flex-wrap:wrap}.guide-switch button{border:1px solid #a68a535e;border-radius:30px;color:#b5aabd;background:transparent;padding:9px 18px;min-height:44px;font-size:12px}.guide-switch button[aria-pressed="true"]{background:#d6bc80;color:#21182b;border-color:#d6bc80}

:root{color-scheme:dark;--gold:#d6bc80;--muted:#b5aabd;--ink:#f3eada}*{box-sizing:border-box}body{margin:0;background:#100d18;color:var(--ink);font-family:"Yu Mincho","Hiragino Mincho ProN",serif;line-height:1.8;background-image:radial-gradient(ellipse at 50% 28%,#37234480,transparent 65%)}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #f5dba0;outline-offset:6px}[hidden]{display:none!important}.shell{max-width:1000px;margin:auto;padding:26px 24px 32px;text-align:center}.brand{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);font-size:13px;letter-spacing:.22em}.brand:before,.brand:after{content:"";height:1px;width:44px;background:#b79b5855}.portrait{position:relative;width:264px;height:350px;margin:30px auto 24px;border-radius:18px;border:1px solid #a58a575e;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#66517b55,transparent 70%),#1c142a;box-shadow:0 0 55px #a278c315}.portrait img{width:100%;height:100%;object-fit:contain;display:block}.placeholder{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--gold)}.moon{font-size:76px;line-height:1;text-shadow:0 0 28px #d6bc8055}.placeholder small{font-size:10px;letter-spacing:.2em;color:#b6a6c3}.eyebrow{color:var(--gold);letter-spacing:.25em;font-size:10px;margin:0 0 12px}h1{font-size:clamp(23px,4.4vw,34px);font-weight:400;letter-spacing:.1em;line-height:1.65;margin:0 0 14px}.intro{color:var(--muted);font-size:13px;letter-spacing:.07em;margin:0}.divider{color:var(--gold);font-size:12px;margin:24px 0;display:flex;justify-content:center;align-items:center;gap:18px}.divider:before,.divider:after{content:"";width:64px;height:1px;background:#aa90513d}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:630px;margin:0 auto}.card{border:1px solid #b69a5c73;background:linear-gradient(145deg,#352341,#1a1426 70%);color:var(--gold);border-radius:70px 70px 6px 6px;padding:12px;min-width:0;aspect-ratio: .7;position:relative;transition:transform .25s,box-shadow .25s,border-color .25s}.card:before{content:"";position:absolute;inset:7px;border:1px solid #a68a5340;border-radius:64px 64px 3px 3px;pointer-events:none}.card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 12px 32px #0005,0 0 22px #c6a06618}.card-inner{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}.card svg{width:64px;height:76px;max-width:75%;fill:none;stroke:currentColor;stroke-width:1.15}.letter{font-size:19px;letter-spacing:.14em;margin-top:18px}.motif{font-size:10px;color:#b7a9c3;letter-spacing:.15em}.hint{font-size:11px;color:#95879f;margin:20px 0 0;letter-spacing:.1em}.result{max-width:560px;margin:0 auto;border:1px solid #ae925351;border-radius:8px;background:linear-gradient(145deg,#2b2037b0,#191321);padding:28px 30px}.result-label{color:var(--gold);font-size:12px;letter-spacing:.18em;margin:0 0 12px}.result h2{font-size:24px;font-weight:400;margin:0 0 18px;color:#e7d1a0}.reading{text-align:left;font-size:15px;line-height:2.25;letter-spacing:.06em;margin:0}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px}.action{border:1px solid #b49a66;border-radius:3px;padding:10px 22px;background:#d5bc80;color:#21182b;font-size:13px;min-height:44px}.action.secondary{background:transparent;color:var(--gold);border-color:#a68a535e}.action:hover{filter:brightness(1.12)}footer{border-top:1px solid #b3975d22;max-width:630px;margin:38px auto 0;padding-top:19px}footer p{color:#95879f;font-size:10px;line-height:1.9;margin:0 0 8px}footer .signature{color:#b59a65;letter-spacing:.18em;font-size:10px}noscript p{color:var(--gold)}@media(max-width:480px){.shell{padding:22px 20px 24px}.portrait{width:236px;height:314px;margin:25px auto 22px}.moon{font-size:60px}.placeholder small{font-size:8px}h1{font-size:23px;letter-spacing:.045em}.intro{font-size:12px}.cards{gap:10px}.card{padding:9px;aspect-ratio:.59;border-radius:55px 55px 5px 5px}.card:before{inset:5px;border-radius:50px 50px 3px 3px}.card svg{width:44px;height:58px}.letter{margin-top:12px;font-size:17px}.motif{font-size:9px;letter-spacing:.05em}.divider{margin:22px 0}.result{padding:24px 22px}.result h2{font-size:21px}.reading{font-size:14px}.actions{gap:10px}.action{padding:10px 16px}footer{margin-top:30px}}@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main class="shell">
<div class="brand" id="guide-name" aria-live="polite">月の案内人 りょうこ</div>
<div class="guide-switch" role="group" aria-label="占い師を選ぶ">
<button type="button" data-guide="ryoko" aria-pressed="true">女性 · りょうこ</button>
<button type="button" data-guide="ren" aria-pressed="false">男性 · れん</button>
</div>
<div class="portrait">
<div class="placeholder" id="placeholder" role="img" aria-label="りょうこの画像の代わりに、静かな月のモチーフを表示しています"><span class="moon" aria-hidden="true">☾</span><small>月の案内人 りょうこ</small></div>
<img id="portrait" alt="月の案内人 りょうこ" hidden>
</div>
<p class="eyebrow">A MOMENT UNDER THE MOON</p>
<h1>今夜、あなたに必要な<br>メッセージ</h1>
<p class="intro" id="intro">ひと息ついて、心を静かに。<br>今、惹かれるカードをひとつ選んでください。</p>
<div class="divider" aria-hidden="true">✧</div>
<section id="selection" aria-label="3枚のカードから選ぶ">
<div class="cards">
<button class="card" type="button" data-card="A" aria-label="カードA、月を選ぶ"><span class="card-inner"><svg viewBox="0 0 64 76" aria-hidden="true"><path d="M44 12a26 26 0 1 0 9 43A27 27 0 0 1 44 12Z"/><path d="m48 23 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z"/><circle cx="20" cy="62" r="1"/></svg><span class="letter">A</span><span class="motif">月 — MOON</span></span></button>
<button class="card" type="button" data-card="B" aria-label="カードB、星を選ぶ"><span class="card-inner"><svg viewBox="0 0 64 76" aria-hidden="true"><path d="m32 10 6 20 20 8-20 7-6 21-6-21-20-7 20-8Z"/><path d="m32 23 3 12 10 3-10 3-3 12-3-12-10-3 10-3Z"/><path d="M9 14v8M5 18h8M52 55v8M48 59h8"/></svg><span class="letter">B</span><span class="motif">星 — STAR</span></span></button>
<button class="card" type="button" data-card="C" aria-label="カードC、鍵を選ぶ"><span class="card-inner"><svg viewBox="0 0 64 76" aria-hidden="true"><circle cx="32" cy="23" r="13"/><circle cx="32" cy="23" r="6"/><path d="M29 36v29h6V54h10v-7H35V36M25 65h14"/><path d="M9 39v6M6 42h6M51 14v6M48 17h6"/></svg><span class="letter">C</span><span class="motif">鍵 — KEY</span></span></button>
</div>
<p class="hint">正解はありません。あなたの直感を大切に。</p>
</section>
<section id="result" class="result" aria-labelledby="result-title" hidden>
<p class="result-label" id="result-label"></p>
<h2 id="result-title" tabindex="-1"></h2>
<p class="reading" id="reading"></p>
<div class="actions"><button class="action" id="again" type="button">もう一度占う</button><button class="action secondary" id="home" type="button">最初に戻る</button></div>
</section>
<noscript><p>カードを選ぶには、ブラウザのJavaScriptを有効にしてください。</p></noscript>
<footer><p>この占いは、娯楽と自己理解のためのコンテンツです。<br>未来や第三者の気持ちを確定するものではありません。<br>心に響く言葉を、あなた自身のペースで受け取ってください。</p><p class="signature">RYOKO ORACLE · 月の案内人 りょうこ</p></footer>
</main>
<script>
'use strict';
const readings = {
 A: { motif: '月', title: '満ちる前の、静かな余白', text: '今夜は、答えを急がずに自分の心へ耳を澄ませてみませんか。月が少しずつ満ちるように、気持ちにも整うまでの時間があってよいのです。誰かに合わせていた予定をひとつ見直したり、温かいお茶でひと息ついたり。小さな休息が、今のあなたに必要なものを見つめるきっかけになるかもしれません。' },
 B: { motif: '星', title: '小さな光を、ひとつ拾って', text: '遠くの大きな目標よりも、今日は身近にある小さな喜びを探してみてください。気になっていた本を開く、好きな音楽を聴く。そんなささやかな選択にも、あなたらしさが宿っています。うまくできるかどうかは、ひとまず脇に置いて。心が少し明るくなることをひとつ選ぶと、次の一歩を考えやすくなるかもしれません。' },
 C: { motif: '鍵', title: '扉を開くのは、あなたのペースで', text: '気になりながら後回しにしていたことはありますか。今夜は、その扉を開ける前に、自分が何を大切にしたいのか言葉にしてみましょう。すぐに行動へ移さなくても大丈夫。できそうなことをひとつ紙に書くだけでも、気持ちを整理する助けになります。誰かの期待よりも、あなたが納得できる歩幅を選んでよいのです。' }
};
const selection = document.getElementById('selection');
const result = document.getElementById('result');
const intro = document.getElementById('intro');
const title = document.getElementById('result-title');
let lastCard = null;
document.querySelectorAll('[data-card]').forEach(button => button.addEventListener('click', () => {
 lastCard = button;
 const key = button.dataset.card, message = readings[key];
 document.getElementById('result-label').textContent = `CARD ${key} · ${message.motif}`;
 title.textContent = message.title;
 document.getElementById('reading').textContent = message.text;
 intro.textContent = '今夜の言葉を、そっとあなたへ。';
 selection.hidden = true; result.hidden = false; title.focus();
}));
function reset(home) {
 result.hidden = true; selection.hidden = false;
 intro.replaceChildren(document.createTextNode('ひと息ついて、心を静かに。'), document.createElement('br'), document.createTextNode('今、惹かれるカードをひとつ選んでください。'));
 if (home) { document.querySelector('[data-card="A"]').focus({preventScroll:true}); window.scrollTo({top:0,behavior:'instant'}); }
 else if (lastCard) lastCard.focus();
}
document.getElementById('again').addEventListener('click', () => reset(false));
document.getElementById('home').addEventListener('click', () => reset(true));
const portrait = document.getElementById('portrait');
portrait.addEventListener('load', () => { portrait.hidden = false; document.getElementById('placeholder').hidden = true; });
portrait.addEventListener('error', () => { portrait.hidden = true; document.getElementById('placeholder').hidden = false; });
const guides = {
 ryoko: { name: 'りょうこ', image: 'assets/ryoko.png' },
 ren: { name: 'れん', image: 'assets/ren.png' }
};
function selectGuide(key) {
 const guide = guides[key];
 document.querySelectorAll('[data-guide]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.guide === key)));
 document.getElementById('guide-name').textContent = `月の案内人 ${guide.name}`;
 document.title = `月の案内人 ${guide.name}｜今夜、あなたに必要なメッセージ`;
 portrait.alt = `月の案内人 ${guide.name}`;
 const placeholder = document.getElementById('placeholder');
 placeholder.setAttribute('aria-label', `${guide.name}の画像の代わりに、静かな月のモチーフを表示しています`);
 placeholder.querySelector('small').textContent = `月の案内人 ${guide.name}`;
 document.querySelector('.signature').textContent = `RYOKO ORACLE · 月の案内人 ${guide.name}`;
 portrait.hidden = true; placeholder.hidden = false;
 portrait.src = guide.image;
}
document.querySelectorAll('[data-guide]').forEach(button => button.addEventListener('click', () => selectGuide(button.dataset.guide)));
selectGuide('ryoko');
</script>
</body>
</html>
