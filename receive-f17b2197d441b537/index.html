<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>BOOTH登録用ファイルの受け取り</title>
<link rel="stylesheet" href="receive.css">
<script src="receive.js" defer></script>
</head>
<body>
<main>
<p class="eyebrow">月の案内人 りょうこ・れん</p>
<h1>登録用ファイルを<br>受け取る</h1>
<p>チャットでお伝えした合言葉を貼り付けてください。</p>
<form id="unlock-form">
<label for="passphrase">合言葉</label>
<input id="passphrase" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<button id="unlock" type="submit">ファイルを開く</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<section id="files" hidden aria-label="保存するファイル">
<p>下のボタンを押して保存してください。通常はパソコンの「ダウンロード」フォルダに入ります。</p>
<a id="book-save" class="save">販売用PDFを保存</a>
<p class="detail">恋愛カード占い・改訂版2.0／20ページ・約1.2MB<br>BOOTHの「ファイルの追加・管理」に登録します。</p>
<a id="cover-save" class="save secondary">商品画像を保存</a>
<p class="detail">BOOTHの「商品画像」に登録します。</p>
</section>
<p class="privacy">合言葉はこのブラウザ内でのみ使います。入力内容は送信しません。ページ上のファイルは暗号化されています。</p>
<noscript>ファイルを受け取るには、ブラウザのJavaScriptを有効にしてください。</noscript>
</main>
</body>
</html>
